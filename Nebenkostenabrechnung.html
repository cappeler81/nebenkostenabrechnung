<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebenkostenabrechnung</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2420;--mu:#66706a;--br:#dcdad2;--ac:#1f6f54;--acx:#fff;--bad:#b3261e;--ok:#1f6f54;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#1d231f;--tx:#e9eee9;--mu:#9aa59e;--br:#323a35;--ac:#5fc59c;--acx:#0d1b14;--bad:#ff8a80;--ok:#5fc59c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141815;--card:#1d231f;--tx:#e9eee9;--mu:#9aa59e;--br:#323a35;--ac:#5fc59c;--acx:#0d1b14;--bad:#ff8a80;--ok:#5fc59c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;margin:0}
.sub{color:var(--mu);font-size:13px;margin:2px 0 0}
.lang{display:flex;border:1px solid var(--br);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--card);color:var(--tx);padding:7px 12px;cursor:pointer;font:inherit;font-weight:600}
.lang button.on{background:var(--ac);color:var(--acx)}
section{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:8px;border:1px solid var(--br);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:12px;color:var(--mu);text-align:left;padding:4px 6px;font-weight:600}
td{padding:4px 6px;vertical-align:middle}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.pair{display:flex;gap:4px}
.pair input{width:70px}
button.b{border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.x{padding:4px 9px}
.sum{display:grid;gap:6px;max-width:420px;margin-left:auto}
.sum div{display:flex;justify-content:space-between;gap:12px}
.res{font-size:20px;font-weight:700;border-top:2px solid var(--br);padding-top:8px;margin-top:4px}
.pos{color:var(--bad)}.neg{color:var(--ok)}
.hint{font-size:12px;color:var(--mu);margin-top:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@page{size:A4;margin:0}
@media print{
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--br:#999;--bad:#000;--ok:#000;color-scheme:light;padding:0}
.lang,.bar,.noprint,p.hint,th:last-child,td:last-child{display:none!important}
body{background:#fff;color:#000;font-size:10.5pt;line-height:1.3}
.wrap{max-width:none;padding:13mm 15mm}
header{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
h1{font-size:20pt}
.sub{color:#444}
section{background:none;border:0;border-bottom:1px solid #999;border-radius:0;padding:8px 0;margin:0;break-inside:avoid}
h2{font-size:10pt;color:#000;border-bottom:0;margin-bottom:6px}
label{font-size:8.5pt;color:#555;margin:0}
input,select{border:0;background:transparent;padding:1px 0;font:inherit;font-weight:600;color:#000;appearance:none;-webkit-appearance:none;-moz-appearance:none;border-radius:0}
input[type=date]::-webkit-calendar-picker-indicator{display:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.g{gap:6px 14px}
.scroll{overflow:visible}
table{min-width:0}
th{color:#000;border-bottom:1px solid #000;font-size:9pt}
td{border-bottom:1px solid #ddd;padding:3px 6px}
input,select{display:none!important}
.pv{display:inline-block;font-weight:600;overflow-wrap:anywhere}
.pair{gap:12px}
table{table-layout:fixed}
th:nth-child(1){width:27%}th:nth-child(2){width:14%}th:nth-child(3){width:21%}th:nth-child(4){width:21%}th:nth-child(5){width:17%}
.sum{max-width:none;margin:0 0 0 auto;width:60%}
.res{border-top:2px solid #000;font-size:14pt}
}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p></div>
 <div class="lang" id="lang"><button data-l="de">DE</button><button data-l="it">IT</button><button data-l="pt">PT</button></div>
</header>

<section><h2 data-t="parties"></h2><div class="g">
 <div><label data-t="landlord"></label><input id="vm"></div>
 <div><label data-t="tenant"></label><input id="mt"></div>
 <div><label data-t="object"></label><input id="obj"></div>
</div></section>

<section><h2 data-t="period"></h2><div class="g">
 <div><label data-t="pFrom"></label><input type="date" id="p1" value="2025-01-01"></div>
 <div><label data-t="pTo"></label><input type="date" id="p2" value="2025-12-31"></div>
 <div><label data-t="uFrom"></label><input type="date" id="u1" value="2025-01-01"></div>
 <div><label data-t="uTo"></label><input type="date" id="u2" value="2025-12-31"></div>
</div></section>

<section><h2 data-t="keysH"></h2><div class="g">
 <div><label data-t="areaM"></label><input type="number" step="0.01" id="a1" value="65"></div>
 <div><label data-t="areaT"></label><input type="number" step="0.01" id="a2" value="520"></div>
 <div><label data-t="perM"></label><input type="number" id="q1" value="2"></div>
 <div><label data-t="perT"></label><input type="number" id="q2" value="16"></div>
 <div><label data-t="unM"></label><input type="number" id="e1" value="1"></div>
 <div><label data-t="unT"></label><input type="number" id="e2" value="8"></div>
</div></section>

<section><h2 data-t="costs"></h2>
 <div class="scroll"><table><thead><tr>
  <th data-t="cName"></th><th data-t="cTotal"></th><th data-t="cKey"></th><th data-t="cCons"></th><th data-t="cShare"></th><th></th>
 </tr></thead><tbody id="rows"></tbody></table></div>
 <div class="bar noprint"><button class="b" id="add"></button></div>
 <p class="hint" data-t="hint"></p>
</section>

<section><h2 data-t="prepH"></h2><div class="g">
 <div><label data-t="prepM"></label><input type="number" step="0.01" id="vz" value="210"></div>
 <div><label data-t="prepN"></label><input type="number" id="vn" value="12"></div>
</div></section>

<section><h2 data-t="result"></h2><div class="sum">
 <div><span data-t="sCosts"></span><b id="s1"></b></div>
 <div><span data-t="sPrep"></span><b id="s2"></b></div>
 <div class="res"><span id="rl"></span><span id="rv"></span></div>
 <div class="hint" id="fac"></div>
</div>
 <div class="bar noprint"><button class="b p" id="print"></button></div>
</section>
</div>

<script>
const T={
de:{title:'Nebenkostenabrechnung',sub:'Betriebskostenabrechnung für Mietverhältnisse',parties:'Parteien',landlord:'Vermieter',tenant:'Mieter',object:'Mietobjekt / Adresse',period:'Zeiträume',pFrom:'Abrechnungszeitraum von',pTo:'Abrechnungszeitraum bis',uFrom:'Nutzungszeitraum von',uTo:'Nutzungszeitraum bis',keysH:'Verteilerschlüssel',areaM:'Wohnfläche Mieter (m²)',areaT:'Gesamtfläche Haus (m²)',perM:'Personen Mieter',perT:'Personen gesamt',unM:'Einheiten Mieter',unT:'Einheiten gesamt',costs:'Kostenpositionen',cName:'Bezeichnung',cTotal:'Gesamtkosten (€)',cKey:'Schlüssel',cCons:'Verbrauch (Mieter / gesamt)',cShare:'Anteil Mieter',add:'+ Position hinzufügen',hint:'Bei „Verbrauch“ den Verbrauch des Mieters und den Gesamtverbrauch eintragen; bei „Direkt“ wird der volle Betrag angesetzt. Die übrigen Schlüssel werden anteilig nach Nutzungsdauer berechnet.',prepH:'Vorauszahlungen',prepM:'Monatliche Vorauszahlung (€)',prepN:'Anzahl Monate',result:'Ergebnis',sCosts:'Summe Nebenkosten (Anteil Mieter)',sPrep:'Geleistete Vorauszahlungen',nach:'Nachzahlung',guth:'Guthaben',fac:'Nutzungsfaktor',print:'Drucken / PDF',kA:'Wohnfläche',kP:'Personen',kU:'Einheiten',kC:'Verbrauch',kD:'Direkt',del:'Entfernen',r1:'Grundsteuer',r2:'Wasser / Abwasser',r3:'Müllabfuhr',r4:'Hausmeister',r5:'Gebäudeversicherung',r6:'Allgemeinstrom',r7:'Straßenreinigung',r8:'Heizkosten',nw:'Neue Position',loc:'de-DE'},
it:{title:'Nebenkostenabrechnung',sub:'Conguaglio delle spese accessorie di locazione (Deutschland)',parties:'Parti',landlord:'Locatore',tenant:'Conduttore',object:'Immobile / indirizzo',period:'Periodi',pFrom:'Periodo di conguaglio dal',pTo:'Periodo di conguaglio al',uFrom:'Periodo di utilizzo dal',uTo:'Periodo di utilizzo al',keysH:'Chiavi di ripartizione',areaM:'Superficie conduttore (m²)',areaT:'Superficie totale edificio (m²)',perM:'Persone conduttore',perT:'Persone totali',unM:'Unità conduttore',unT:'Unità totali',costs:'Voci di spesa',cName:'Descrizione',cTotal:'Costi totali (€)',cKey:'Chiave',cCons:'Consumo (conduttore / totale)',cShare:'Quota conduttore',add:'+ Aggiungi voce',hint:'Per «Consumo» inserire il consumo del conduttore e il consumo totale; per «Diretto» si applica l’intero importo. Le altre chiavi sono calcolate pro rata in base alla durata di utilizzo.',prepH:'Acconti versati',prepM:'Acconto mensile (€)',prepN:'Numero di mesi',result:'Risultato',sCosts:'Totale spese accessorie (quota conduttore)',sPrep:'Acconti versati',nach:'Conguaglio a debito',guth:'Credito',fac:'Fattore di utilizzo',print:'Stampa / PDF',kA:'Superficie',kP:'Persone',kU:'Unità',kC:'Consumo',kD:'Diretto',del:'Rimuovi',r1:'Imposta fondiaria',r2:'Acqua / scarichi',r3:'Rifiuti',r4:'Portiere / custode',r5:'Assicurazione edificio',r6:'Elettricità parti comuni',r7:'Pulizia strade',r8:'Riscaldamento',nw:'Nuova voce',loc:'it-IT'},
pt:{title:'Nebenkostenabrechnung',sub:'Acerto de despesas acessórias de arrendamento (Alemanha)',parties:'Partes',landlord:'Senhorio',tenant:'Inquilino',object:'Imóvel / morada',period:'Períodos',pFrom:'Período de acerto de',pTo:'Período de acerto até',uFrom:'Período de utilização de',uTo:'Período de utilização até',keysH:'Critérios de repartição',areaM:'Área do inquilino (m²)',areaT:'Área total do edifício (m²)',perM:'Pessoas do inquilino',perT:'Pessoas no total',unM:'Unidades do inquilino',unT:'Unidades no total',costs:'Rubricas de custos',cName:'Designação',cTotal:'Custos totais (€)',cKey:'Critério',cCons:'Consumo (inquilino / total)',cShare:'Parte do inquilino',add:'+ Adicionar rubrica',hint:'Em «Consumo», indique o consumo do inquilino e o consumo total; em «Direto», aplica-se o valor integral. Os restantes critérios são calculados proporcionalmente ao tempo de utilização.',prepH:'Adiantamentos',prepM:'Adiantamento mensal (€)',prepN:'Número de meses',result:'Resultado',sCosts:'Total das despesas (parte do inquilino)',sPrep:'Adiantamentos pagos',nach:'Pagamento adicional',guth:'Crédito a favor',fac:'Fator de utilização',print:'Imprimir / PDF',kA:'Área',kP:'Pessoas',kU:'Unidades',kC:'Consumo',kD:'Direto',del:'Remover',r1:'Imposto predial',r2:'Água / esgotos',r3:'Recolha de lixo',r4:'Porteiro / zelador',r5:'Seguro do edifício',r6:'Eletricidade das partes comuns',r7:'Limpeza de ruas',r8:'Aquecimento',nw:'Nova rubrica',loc:'pt-PT'}
};
let L='de';
try{L=localStorage.getItem('nk-lang')||'de'}catch(e){}
if(!T[L])L='de';
const KEYS=['A','P','U','C','D'];
const rows=[['r1',1200,'A'],['r2',3100,'P'],['r3',980,'P'],['r4',2400,'A'],['r5',1850,'A'],['r6',420,'U'],['r7',160,'A'],['r8',9800,'C',3200,9400]].map(r=>({nk:r[0],name:null,tot:r[1],key:r[2],cm:r[3]||0,ct:r[4]||0}));
const $=id=>document.getElementById(id);
const v=id=>parseFloat($(id).value)||0;
const nm=r=>r.name!==null?r.name:T[L][r.nk];
function fmt(x){return new Intl.NumberFormat(T[L].loc,{style:'currency',currency:'EUR'}).format(x)}
function days(a,b){const d=(new Date(b)-new Date(a))/864e5+1;return isNaN(d)?0:Math.max(d,0)}
function share(r,f){
 const d=(a,b)=>b>0?a/b:0;
 if(r.key==='A')return r.tot*d(v('a1'),v('a2'))*f;
 if(r.key==='P')return r.tot*d(v('q1'),v('q2'))*f;
 if(r.key==='U')return r.tot*d(v('e1'),v('e2'))*f;
 if(r.key==='C')return r.tot*d(r.cm,r.ct);
 return r.tot;
}
function render(){
 const t=T[L];
 document.documentElement.lang=L;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
 $('add').textContent=t.add;$('print').textContent=t.print;
 document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 $('rows').innerHTML=rows.map((r,i)=>`<tr>
  <td><input data-i="${i}" data-f="name" value="${nm(r).replace(/"/g,'&quot;')}"></td>
  <td><input type="number" step="0.01" data-i="${i}" data-f="tot" value="${r.tot}"></td>
  <td><select data-i="${i}" data-f="key">${KEYS.map(k=>`<option value="${k}"${k===r.key?' selected':''}>${t['k'+k]}</option>`).join('')}</select></td>
  <td>${r.key==='C'?`<div class="pair"><input type="number" step="any" data-i="${i}" data-f="cm" value="${r.cm}"><input type="number" step="any" data-i="${i}" data-f="ct" value="${r.ct}"></div>`:''}</td>
  <td class="n" id="rs${i}"></td>
  <td><button class="b x" data-del="${i}" title="${t.del}">✕</button></td></tr>`).join('');
 calc();
}
function calc(){
 const t=T[L];
 const pd=days($('p1').value,$('p2').value);
 let f=pd>0?Math.min(days($('u1').value,$('u2').value)/pd,1):1;
 let sum=0;
 rows.forEach((r,i)=>{const s=share(r,f);sum+=s;const c=$('rs'+i);if(c)c.textContent=fmt(s)});
 const prep=v('vz')*v('vn');
 const diff=sum-prep;
 $('s1').textContent=fmt(sum);$('s2').textContent=fmt(prep);
 $('rl').textContent=diff>0?t.nach:t.guth;
 $('rv').textContent=fmt(Math.abs(diff));
 $('rv').className=diff>0?'pos':'neg';
 $('fac').textContent=t.fac+': '+(f*100).toFixed(1).replace('.',L==='en'?'.':',')+' %';
}
document.addEventListener('input',e=>{
 const el=e.target,i=el.dataset.i;
 if(i!==undefined){
  const r=rows[i],f=el.dataset.f;
  if(f==='name')r.name=el.value;
  else if(f==='key'){r.key=el.value;render();return}
  else r[f]=parseFloat(el.value)||0;
 }
 calc();
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.l){L=b.dataset.l;try{localStorage.setItem('nk-lang',L)}catch(x){}render()}
 else if(b.dataset.del!==undefined){rows.splice(+b.dataset.del,1);render()}
 else if(b.id==='add'){rows.push({nk:'nw',name:null,tot:0,key:'A',cm:0,ct:0});render()}
 else if(b.id==='print'){try{window.print()}catch(x){}}
});
render();
function pvOff(){document.querySelectorAll('.pv').forEach(e=>e.remove())}
function pvOn(){
 pvOff();
 document.querySelectorAll('input,select').forEach(el=>{
  const s=document.createElement('span');s.className='pv';
  let t=el.value;
  if(el.tagName==='SELECT')t=el.options[el.selectedIndex].text;
  else if(el.type==='date'&&t)t=new Date(t+'T00:00').toLocaleDateString(T[L].loc);
  else if(el.type==='number'&&t!=='')t=new Intl.NumberFormat(T[L].loc,{maximumFractionDigits:2}).format(parseFloat(t));
  s.textContent=t;el.after(s);
 });
}
addEventListener('beforeprint',pvOn);
addEventListener('afterprint',pvOff);
</script>
</body>
</html>
